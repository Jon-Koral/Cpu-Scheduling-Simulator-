<!Doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CPU Scheduling Simulator</title>
    <script defer src="main.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<H1>CPU Scheduling Simulator</H1>

<div id="algorithmSelector">

    <!-- Mode toggle -->
    <div id="mode-toggle">
        <button id="btn-single" class="mode-btn mode-btn-active" onclick="setMode('single')">Single</button>
        <button id="btn-compare" class="mode-btn" onclick="setMode('compare')">Compare</button>
    </div>

    <!-- Single mode: one dropdown -->
    <div id="single-controls">
        <label for="algorithm">Algorithm:</label>
        <select id="algorithm" onchange="handleAlgorithmChange()">
            <option value="FCFS">FCFS</option>
            <option value="SJF">SJF</option>
            <option value="SRTF">SRTF</option>
            <option value="RR">RR</option>
            <option value="Priority">Priority</option>
        </select>
    </div>

    <!-- Compare mode: checkboxes -->
    <div id="compare-controls">
        <span class="compare-label">Algorithms:</span>
        <label class="algo-checkbox"><input type="checkbox" value="FCFS" checked> FCFS</label>
        <label class="algo-checkbox"><input type="checkbox" value="SJF"  checked> SJF</label>
        <label class="algo-checkbox"><input type="checkbox" value="SRTF">         SRTF</label>
        <label class="algo-checkbox"><input type="checkbox" value="RR">           RR</label>
        <label class="algo-checkbox"><input type="checkbox" value="Priority">      Priority</label>
    </div>

    <!-- Quantum (shown for RR in either mode) -->
    <div id="quantum-group">
        <label for="quantum">Quantum:</label>
        <input type="number" id="quantum" min="1" max="100" value="2">
    </div>

    <button id="run-algorithm" onclick="run()">Run</button>
</div>

<!-- Process List -->
<div id="process-container">
    <h3>Processes</h3>
    <div id="process-list"></div>
    <button class="btn-add-process" onclick="openModal()">+ Add Process</button>
</div>

<!-- Modal -->
<div id="modal" onclick="handleOverlayClick(event)">
    <div id="modal-box">
        <h2>Add new Process</h2>
        <div class="modal-field">
            <label for="arrival-time">Arrival Time</label>
            <input type="number" id="arrival-time" placeholder="e.g. 0" min="0">
        </div>
        <div class="modal-field">
            <label for="burst-time">Burst Time</label>
            <input type="number" id="burst-time" placeholder="e.g. 5" min="1">
        </div>
        <div class="modal-field">
            <label for="priority">Priority <span style="font-weight:400">(optional)</span></label>
            <input type="number" id="priority" placeholder="e.g. 1" min="0">
        </div>
        <p class="error" id="modal-error"></p>
        <div class="modal-buttons">
            <button class="btn-add" onclick="addProcess()">Add</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Single-mode results -->
<div id="results">
    <h2>Results</h2>
    <h3>Gantt Chart</h3>
    <div id="gantt-chart"></div>
    <h3>Process Table</h3>
    <table>
        <thead>
        <tr>
            <th>Process</th>
            <th>Arrival Time</th>
            <th>Burst Time</th>
            <th>Priority</th>
            <th>Waiting Time</th>
            <th>Turnaround Time</th>
        </tr>
        </thead>
        <tbody id="process-table-body"></tbody>
    </table>
    <div id="averages"></div>
</div>

<!-- Compare-mode results -->
<div id="comparison-results">
    <h2>Comparison Results</h2>

    <!-- Summary table across all algorithms -->
    <h3>Summary</h3>
    <table id="comparison-summary-table">
        <thead>
        <tr>
            <th>Algorithm</th>
            <th>Avg Waiting Time</th>
            <th>Avg Turnaround Time</th>
            <th>Throughput</th>
        </tr>
        </thead>
        <tbody id="comparison-summary-body"></tbody>
    </table>

    <!-- One Gantt chart + process table per algorithm -->
    <div id="comparison-charts"></div>
</div>

</body>
</html>
